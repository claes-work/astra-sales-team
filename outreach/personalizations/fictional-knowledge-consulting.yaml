  Für Ihre erfundene Lernmaterialsammlung wäre das ein möglicher Ausgangspunkt, um den Nutzen einer unterstützten Auswahl zu prüfen. Ob dafür KI oder eine einfache Inhaltsübersicht besser passt, bleibt offen.

